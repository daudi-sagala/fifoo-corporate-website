# INACTIVE TEMPLATE: copy to .github/workflows/azure-static-web-apps.yml after setup.
# No token belongs in this file. Configure the named GitHub Actions secret.
# Sources and setup: docs/DEPLOY_AZURE.md and docs/SOURCES.md.
name: Publish Fifoo corporate website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fifoo-corporate-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run isolated build and safety tests
        run: npm test
      - name: Build reviewed production website
        run: npm run build:production
      - name: Verify deployment secret is configured
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Add AZURE_STATIC_WEB_APPS_API_TOKEN to repository Actions secrets."
            exit 1
          fi
      - name: Deploy static files
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: main
